<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ID Card Studio</title><link rel="stylesheet" href="styles.css"><header><b>◈ ID Card Studio</b><span>YOUR DETAILS. YOUR CARD.</span></header><main><aside><h2><i>01</i>上传照片</h2><label>头像照片<input type="file" id="face" accept="image/*"></label><label>全身照片<input type="file" id="body" accept="image/*"></label><h2><i>02</i>个人资料</h2><input id="title" type="hidden" value="FAG IDENTIFICATION CARD"><label>姓名<input id="name" placeholder="请输入姓名" maxlength="40"></label><div class="row"><div><label>体重（kg）<input id="weight" placeholder="例如：70" inputmode="decimal" maxlength="16"></label></div><div><label>身高（cm）<input id="height" placeholder="例如：175" inputmode="decimal" maxlength="16"></label></div></div><label>出生日期<input id="dob" type="text" placeholder="2000-01-30" maxlength="30"></label><label>所在地<input id="location" placeholder="你的地址" maxlength="50"></label><label>社交账号<input id="social" placeholder="例如：@你的用户名" maxlength="40"></label><input id="signed" type="hidden"><input id="fid" type="hidden"><p class="note">照片与资料仅在当前浏览器处理。模板会在本地叠加你填写的姓名、个人资料、社交账号及上传的照片，生成卡片。</p><label class="consent"><input id="consent" type="checkbox"><span>我确认这些内容属于我本人，或我已获得使用许可，并同意负责任地使用本生成工具。</span></label><button id="download" disabled>生成并下载 ID 卡</button><div id="status" role="status"></div></aside><section class="preview"><div class="topline"><div><h1>制作你的专属 ID</h1></div><span class="tag">LIVE PREVIEW</span></div><canvas id="card" width="1800" height="1200" aria-label="个人 ID 卡实时预览"></canvas></section></main><script src="app.js"></script></html>
